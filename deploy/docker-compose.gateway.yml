# LlamaNet Gateway — enterprise self-hosting (single VM / internal server)
#
# Usage:
#   cd deploy
#   cp gateway.env.example .env    # fill in your values
#   docker compose -f docker-compose.gateway.yml up -d
#
# The gateway is lightweight (no GPU needed). Nodes do the inference.

services:
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    image: llamanet-gateway:latest
    container_name: llamanet-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
