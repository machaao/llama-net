version: '3'

services:
  # Bootstrap node - first inference node that others can connect to
  bootstrap:
    build:
      context: ..
      dockerfile: docker/inference.Dockerfile
    ports:
      - "8000:8000"
      - "8001:8001"  # DHT port
    environment:
      - PORT=8000
      - DHT_PORT=8001
      - NODE_ID=bootstrap-node
      - BOOTSTRAP_NODES=""
      # MODEL_PATH is optional - set it if you have a model, omit for no-model mode
      - MODEL_PATH=/models/model.gguf
    volumes:
      - ../models:/models
      - llamanet-models:/root/.llamanet/models
    restart: unless-stopped

  # Additional inference nodes
  inference1:
    build:
      context: ..
      dockerfile: docker/inference.Dockerfile
    ports:
      - "8002:8000"
      - "8003:8001"  # DHT port
    environment:
      - MODEL_PATH=/models/model.gguf
      - PORT=8000
      - DHT_PORT=8001
      - BOOTSTRAP_NODES=bootstrap:8001
    volumes:
      - ../models:/models
    depends_on:
      - bootstrap
    restart: unless-stopped

  inference2:
    build:
      context: ..
      dockerfile: docker/inference.Dockerfile
    ports:
      - "8004:8000"
      - "8005:8001"  # DHT port
    environment:
      - MODEL_PATH=/models/model.gguf
      - PORT=8000
      - DHT_PORT=8001
      - BOOTSTRAP_NODES=bootstrap:8001
    volumes:
      - ../models:/models
    depends_on:
      - bootstrap
    restart: unless-stopped
