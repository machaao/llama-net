[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llamanet"
version = "0.1.8"
description = "Decentralized Inference Swarm for llama.cpp"
authors = [{name = "LlamaNet Team", email = "example@example.com"}]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.8"
keywords = ["llm", "inference", "decentralized"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]

dependencies = [
    "fastapi>=0.68.0,<1.0.0",
    "uvicorn[standard]>=0.15.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "requests>=2.26.0,<3.0.0",
    "aiohttp>=3.8.0,<4.0.0",
    "httptools",
    "supabase>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    # Inference-only (install separately via requirements-inference.txt):
    # Inference-only (install separately via requirements-inference.txt):
    # "llama-cpp-python>=0.2.20",
    # "psutil>=5.8.0,<6.0.0",
    # "pynvml>=11.4.1",
    # "tqdm>=4.64.0",
    # "huggingface_hub>=0.0.1",
]

[project.urls]
Homepage = "https://github.com/machaao/llamanet"
Repository = "https://github.com/machaao/llamanet"

[project.scripts]
llamanet = "inference_node.server:start_server"

[tool.setuptools.packages.find]
include = ["client*", "common*", "inference_node*", "landing*"]
