<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Authenticating...</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body>
    <div class="container text-center mt-5"><div class="spinner-border text-primary mb-3"></div><p>Authenticating with Google...</p></div>
    <script>
        (function() {
            var hash = window.location.hash;
            if (hash) {
                var params = new URLSearchParams(hash.substring(1));
                var accessToken = params.get('access_token');
                var refreshToken = params.get('refresh_token');
                
                if (accessToken) {
                    // Set cookie for server-side auth
                    document.cookie = 'llamanet_session=' + accessToken + '; path=/; max-age=604800; SameSite=Lax';
                    localStorage.setItem('supabase_access_token', accessToken);
                    if (refreshToken) localStorage.setItem('supabase_refresh_token', refreshToken);
                    
                    // If opened in a popup, send token to parent window and close
                    if (window.opener && !window.opener.closed) {
                        try {
                            window.opener.postMessage({
                                type: 'llamanet-auth-callback',
                                access_token: accessToken,
                                refresh_token: refreshToken || ''
                            }, window.location.origin);
                            window.close();
                            return;
                        } catch (e) {
                            console.warn('Could not postMessage to opener:', e);
                        }
                    }
                }
            }
            // Fallback: redirect to dashboard (direct navigation flow)
            window.location.href = '/dashboard';
        })();
    </script>
</body>
</html>
